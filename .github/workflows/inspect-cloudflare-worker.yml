name: Inspect production Worker configuration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - worker-inspection-trigger.txt

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read existing Worker settings and cron triggers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/ommen-push-v2"

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${BASE}/settings" -o settings.json

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${BASE}/schedules" -o schedules.json

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${BASE}/versions?per_page=5" -o versions.json

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${BASE}/deployments" -o deployments.json

          ACTIVE_VERSION=$(jq -r '.result.deployments[0].versions[0].version_id' deployments.json)
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${BASE}/versions/${ACTIVE_VERSION}" -o active-version.json

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${BASE}/content/v2" -D active-content.headers -o active-content.bin

          echo "=== Worker bindings (secret values excluded) ==="
          jq -e '.success == true' settings.json >/dev/null
          echo "=== Worker settings excluding bindings ==="
          jq '.result | del(.bindings)' settings.json
          echo "=== Worker bindings (secret values excluded) ==="
          jq '{
            bindings: [.result.bindings[]? | {
              name,
              type,
              namespace_id: (.namespace_id // null),
              class_name: (.class_name // null)
            }],
            compatibility_date: .result.compatibility_date,
            compatibility_flags: .result.compatibility_flags,
            usage_model: .result.usage_model
          }' settings.json

          echo "=== Public VAPID configuration (no private key) ==="
          jq '[
            .result.bindings[]?
            | select(.name == "VAPID_PUBLIC_KEY" or .name == "VAPID_SUBJECT")
            | {name, type, value: (.text // .value // null)}
          ]' settings.json

          echo "=== Cron triggers ==="
          jq -e '.success == true' schedules.json >/dev/null
          jq '.result.schedules' schedules.json

          echo "=== Current deployment and recent versions ==="
          jq -e '.success == true' versions.json >/dev/null
          jq -e '.success == true' deployments.json >/dev/null
          echo "Deployments:"
          jq '.result.deployments[]? | {id, created_on, versions}' deployments.json
          echo "Recent uploaded versions:"
          jq 'if (.result | type) == "array" then [.result[] | {id, number, metadata}] else .result end' versions.json

          echo "=== Active version code metadata ==="
          jq '{version_id: .result.id, resources: {script: .result.resources.script, script_runtime: .result.resources.script_runtime, bindings: [.result.resources.bindings[]? | {name, type}]}}' active-version.json
          echo "=== Active script content format ==="
          grep -i "^content-type:" active-content.headers || true
          file active-content.bin
          python3 - <<'PY'
          from email.parser import BytesParser
          from email.policy import default
          from pathlib import Path
          headers = Path("active-content.headers").read_text(errors="replace")
          content_type = next((x.split(":",1)[1].strip() for x in headers.splitlines() if x.lower().startswith("content-type:")), "")
          raw = Path("active-content.bin").read_bytes()
          if content_type.lower().startswith("multipart/"):
              message = BytesParser(policy=default).parsebytes(("MIME-Version: 1.0\nContent-Type: "+content_type+"\n\n").encode()+raw)
              import hashlib
              for part in message.iter_parts():
                  payload = part.get_payload(decode=True) or b""
                  print({"filename": part.get_filename(), "content_type": part.get_content_type(), "bytes": len(payload), "sha256": hashlib.sha256(payload).hexdigest()})
                  source = payload.decode("utf-8", "replace")
                  for marker in ["Worker v280", "Worker v284", "processArticleDeliveries", "matchesSourceSelection", "MAX_CRON_PUSHES", "isRecentPushArticle", "VAPID_PUBLIC_FALLBACK", "pushselectie:"]:
                      print("marker", marker, marker in source)
          else:
              print("response_bytes", len(raw), "prefix", raw[:160].decode("utf-8","replace"))
          PY
