name: Remove isolated NieuwOmmen push-test resources

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 5218d013ac30f1f7c006890eb67f349f

jobs:
  delete-test-worker:
    name: Delete and verify Worker nieuwommen
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the temporary Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Target is exactly: nieuwommen"
          echo "Production Worker ommen-push-v2 is not targeted."
          npx --yes wrangler@4 delete --name nieuwommen --dry-run
          yes | npx --yes wrangler@4 delete --name nieuwommen

      - name: Verify temporary Worker is gone
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/worker-check.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/nieuwommen")"
          if [ "$status" = "404" ]; then
            echo "Verified: Worker nieuwommen no longer exists."
          else
            cat /tmp/worker-check.json
            echo "Worker verification returned HTTP $status; deletion is not confirmed."
            exit 1
          fi

  delete-test-kv:
    name: Delete and verify dedicated test KV namespace
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the dedicated test namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 kv namespace delete --namespace-id dc6d012dfcf547e38e270d1ff010f012 --skip-confirmation

      - name: Verify dedicated test namespace is gone
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          namespaces="$(npx --yes wrangler@4 kv namespace list)"
          printf '%s' "$namespaces" | node -e '
            let s = "";
            process.stdin.on("data", d => s += d).on("end", () => {
              let a;
              try { a = JSON.parse(s); } catch { console.error(s); process.exit(2); }
              if (Array.isArray(a) && a.some(x => x.id === "dc6d012dfcf547e38e270d1ff010f012")) {
                console.error("Test KV namespace still exists.");
                process.exit(1);
              }
              console.log("Verified: dedicated test KV namespace is absent from the namespace list.");
            });
          '

  delete-test-pages:
    name: Delete and verify test Pages project
    runs-on: ubuntu-latest
    steps:
      - name: Delete only nieuwommen-push-test if present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          projects="$(npx --yes wrangler@4 pages project list --json)"
          if printf '%s' "$projects" | node -e '
            let s = "";
            process.stdin.on("data", d => s += d).on("end", () => {
              try {
                const a = JSON.parse(s);
                process.exit(Array.isArray(a) && a.some(p => p.name === "nieuwommen-push-test") ? 0 : 1);
              } catch { process.exit(2); }
            });
          '; then
            npx --yes wrangler@4 pages project delete nieuwommen-push-test --yes
          else
            echo "Dedicated Pages project nieuwommen-push-test is already absent."
          fi

      - name: Verify test Pages project is gone
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          projects="$(npx --yes wrangler@4 pages project list --json)"
          printf '%s' "$projects" | node -e '
            let s = "";
            process.stdin.on("data", d => s += d).on("end", () => {
              let a;
              try { a = JSON.parse(s); } catch { console.error(s); process.exit(2); }
              if (!Array.isArray(a)) { console.error("Unexpected Pages project list."); process.exit(2); }
              if (a.some(p => p.name === "nieuwommen-push-test")) {
                console.error("Test Pages project still exists.");
                process.exit(1);
              }
              console.log("Verified: Pages project nieuwommen-push-test is absent.");
            });
          '
