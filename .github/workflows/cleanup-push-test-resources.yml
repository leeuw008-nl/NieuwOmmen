name: Remove isolated NieuwOmmen push-test resources

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 5218d013ac30f1f7c006890eb67f349f

jobs:
  delete-test-worker:
    name: Delete and verify Worker nieuwommen
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the temporary Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Target is exactly: nieuwommen"
          echo "Production Worker ommen-push-v2 is not targeted."
          response="$(curl -fsS -X DELETE \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/nieuwommen")"
          printf '%s' "$response" | node -e '
            let s = "";
            process.stdin.on("data", d => s += d).on("end", () => {
              let body;
              try { body = JSON.parse(s); } catch { console.error(s); process.exit(2); }
              if (body.success !== true) { console.error(s); process.exit(1); }
              console.log("Cloudflare accepted deletion of Worker nieuwommen.");
            });
          '

      - name: Verify temporary Worker is gone
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/worker-check.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/nieuwommen")"
          if [ "$status" = "404" ]; then
            echo "Verified: Worker nieuwommen no longer exists."
          else
            cat /tmp/worker-check.json
            echo "Worker verification returned HTTP $status; deletion is not confirmed."
            exit 1
          fi

  delete-test-kv:
    name: Delete and verify dedicated test KV namespace
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the dedicated test namespace via Cloudflare API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/dc6d012dfcf547e38e270d1ff010f012"
          status="$(curl -sS -o /tmp/kv-delete.json -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$url")"
          cat /tmp/kv-delete.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "KV deletion API returned HTTP $status."
            exit 1
          fi
          node -e 'const b=require("/tmp/kv-delete.json"); if(b.success!==true) process.exit(1); console.log("Cloudflare accepted deletion of the dedicated test KV namespace.");'

      - name: Verify dedicated test namespace is gone
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/kv-list.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces")"
          cat /tmp/kv-list.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "KV verification API returned HTTP $status."
            exit 1
          fi
          node -e 'const b=require("/tmp/kv-list.json"); const a=b.result; if(!Array.isArray(a)) process.exit(2); if(a.some(x=>x.id==="dc6d012dfcf547e38e270d1ff010f012")) process.exit(1); console.log("Verified: dedicated test KV namespace is absent.");'

  delete-test-pages:
    name: Delete and verify test Pages project
    runs-on: ubuntu-latest
    steps:
      - name: Delete only nieuwommen-push-test via Cloudflare API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          status="$(curl -sS -o /tmp/pages-list.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base")"
          cat /tmp/pages-list.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Pages list API returned HTTP $status."
            exit 1
          fi
          node -e 'const b=require("/tmp/pages-list.json"); const a=b.result; if(!Array.isArray(a)) process.exit(2); process.exit(a.some(p=>p.name==="nieuwommen-push-test")?0:1);' && found=1 || found=0
          if [ "$found" = "1" ]; then
            delete_status="$(curl -sS -o /tmp/pages-delete.json -w '%{http_code}' -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/nieuwommen-push-test")"
            cat /tmp/pages-delete.json
            if [ "$delete_status" -lt 200 ] || [ "$delete_status" -ge 300 ]; then
              echo "Pages deletion API returned HTTP $delete_status."
              exit 1
            fi
            node -e 'const b=require("/tmp/pages-delete.json"); if(b.success!==true) process.exit(1);'
            echo "Cloudflare accepted deletion of Pages project nieuwommen-push-test."
          else
            echo "Dedicated Pages project nieuwommen-push-test is already absent."
          fi

      - name: Verify test Pages project is gone
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/pages-verify.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects")"
          cat /tmp/pages-verify.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Pages verification API returned HTTP $status."
            exit 1
          fi
          node -e 'const b=require("/tmp/pages-verify.json"); const a=b.result; if(!Array.isArray(a)) process.exit(2); if(a.some(p=>p.name==="nieuwommen-push-test")) process.exit(1); console.log("Verified: Pages project nieuwommen-push-test is absent.");'
