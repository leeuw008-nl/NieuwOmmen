name: Isolated parser comparison
on:
  push:
    branches:
      - test/push-only-baseline-2026-11-10
    paths:
      - 'app.js'
      - 'worker-v280.js'
      - 'tests/parser-comparison.cjs'
      - '.github/workflows/parser-comparison.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute original app and Worker RSS parsers on identical fixture
        run: node tests/parser-comparison.cjs
