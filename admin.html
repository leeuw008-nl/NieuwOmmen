<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Nieuw(s)Ommen</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#f5f7fb;color:#1a1a1a;line-height:1.6;max-width:680px;margin:0 auto;width:100%;padding:0 16px}
header{background:#0b5bd3;color:white;position:sticky;top:0;z-index:10;max-width:680px;margin:0 auto;width:100%;border-radius:0 0 14px 14px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.header-inner{position:relative;display:flex;align-items:center;justify-content:center;padding:14px 16px;min-height:56px}
header a.back-btn{position:absolute;left:10px;top:50%;transform:translateY(-50%);display:inline-flex;align-items:center;justify-content:center;background:#ffffff;color:#0b5bd3;text-decoration:none;line-height:1;padding:0;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.22);width:40px;height:40px;min-width:40px;min-height:40px;border:2px solid #ffffff}
header a.back-btn:hover{background:#eef4ff}
header h1{font-size:18px;font-weight:700;text-align:center;flex:1}
.tabs-wrap{background:white;border-bottom:1px solid #e5e7eb;position:sticky;top:62px;z-index:9;max-width:680px;margin:8px auto 0;width:100%;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tabs{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;white-space:nowrap}
.tabs button{padding:8px 14px;border-radius:20px;border:1px solid #d1d5db;background:white;font-size:14px;cursor:pointer;flex-shrink:0}
.tabs button.active{background:#0b5bd3;color:white;border-color:#0b5bd3}
.tabs button.admin-tab{background:#fff7ed;border-color:#fb923c;color:#9a3412;display:none}
.tabs button.admin-tab.visible{display:inline-flex;align-items:center;gap:6px}
.tabs button.admin-tab.visible.active{background:#f97316;color:white;border-color:#f97316}
.badge{font-size:10px;background:#f97316;color:white;padding:2px 6px;border-radius:10px;font-weight:800}
.content{max-width:680px;margin:0 auto;padding:20px 0 40px;width:100%}
.panel{display:none;background:white;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.panel.active{display:block}
h2{font-size:20px;margin-bottom:12px;color:#0b5bd3}
h3{font-size:16px;margin:16px 0 8px;color:#111}
p{margin-bottom:12px;color:#374151}
ul{margin:8px 0 12px 20px;color:#374151}
li{margin-bottom:6px}
.source-grid{display:grid;grid-template-columns:1fr;gap:6px;margin:8px 0} /* ENIGE WIJZIGING 1: was 10px gap, 12px margin */
@media(min-width:600px){.source-grid{grid-template-columns:1fr 1fr}}
.source-card{border:1px solid #e5e7eb;border-radius:10px;padding:8px 12px;background:#fafafa;line-height:1.25} /* ENIGE WIJZIGING 2: was 12px padding, line-height 1.6 -> 1.25 */
.source-card strong{display:block;color:#111;margin-bottom:2px;line-height:1.2} /* ENIGE WIJZIGING 3: was geen line-height */
.source-card span{font-size:13px;color:#6b7280;line-height:1.2} /* ENIGE WIJZIGING 4: was geen line-height */
.btn{padding:10px 16px;border-radius:8px;border:0;background:#0b5bd3;color:white;font-weight:600;cursor:pointer;margin:6px 6px 6px 0}
.btn.secondary{background:#e5e7eb;color:#111}
.btn.orange{background:#f97316}
.result{background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:12px;margin-top:12px;font-family:monospace;font-size:13px;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto}
.admin-only{border:2px solid #fb923c;background:#fff7ed;border-radius:12px;padding:16px;margin-top:16px}
.hidden{display:none !important}
.admin-only{margin-top:0}.content{padding-top:16px}#admin-protected[hidden]{display:none!important}#access-message[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="header-inner"><a href="./" class="back-btn" title="Terug naar nieuws" aria-label="Terug naar nieuws"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="display:block">
<path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
</svg></a><h1>Nieuw(s)Ommen - Admin</h1></div></header>
<div class="content"><div id="access-message" class="panel active">Admin-toegang controleren...</div><div id="admin-protected" class="panel active" hidden>
<h2>Beheer &amp; Diagnose <span class="badge">ADMIN</span></h2>

<h2>Beheer & Diagnose <span class="badge">ALLEEN VOOR ADMIN</span></h2>
<div class="admin-only">
<p><strong>Ingelogd als admin:</strong> <span id="adminEmail">-</span></p>
<p id="adminStatus" style="font-size:13px;color:#6b7280">Controleren...</p>
<h3>1. Push status</h3>
<p id="pushStatus">Controleren...</p>
<label for="pushTestSource" style="display:block;margin:8px 0 4px;font-weight:600">Bron voor testpush</label>
<select id="pushTestSource" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;background:white;font-size:14px;margin-bottom:6px">
<option value="De Stentor">De Stentor</option>
<option value="Gemeente Ommen">Gemeente Ommen</option>
<option value="Natuurlijk Ommen">Natuurlijk Ommen</option>
<option value="Ommen City">Ommen City</option>
<option value="OudOmmen">OudOmmen</option>
<option value="RondOmmen">RondOmmen</option>
<option value="RTV Oost">RTV Oost</option>
<option value="RTV Vechtdal">RTV Vechtdal</option>
<option value="Vechtdal Centraal">Vechtdal Centraal</option>
<option value="Nieuwsbrief">Nieuwsbrief</option>
</select>
<button class="btn" id="btnLocal">Test lokale notificatie</button>
<button class="btn orange" id="btnPush">Test echte push + bronfilter</button>
<button class="btn secondary" id="btnCheckDebug">Check /debug</button>
<h3 style="margin-top:20px">2. Service Worker</h3>
<p id="swStatus">Controleren...</p>
<h3>Resultaat</h3>
<div class="result" id="result">Nog geen test uitgevoerd.</div>
</div>
</div></div>
<script>
const ADMIN_EMAIL='leeuw008@gmail.com';
const WORKER_AUTH='https://ommen-push-v2.leeuw008.workers.dev';
async function checkAdmin(){
  const message=document.getElementById('access-message');
  const protectedPanel=document.getElementById('admin-protected');
  protectedPanel.hidden=true;
  message.hidden=false;
  message.textContent='Admin-toegang controleren...';
  const token=localStorage.getItem('ommen_auth_token')||'';
  if(!token){message.textContent='Geen toegang. Log eerst met je beheerdersaccount in via Nieuws > Account.';return;}
  try{
    const response=await fetch(WORKER_AUTH+'/auth/me',{headers:{Authorization:'Bearer '+token},cache:'no-store'});
    if(!response.ok)throw new Error('Sessie niet geldig');
    const data=await response.json();
    const user=data.user||data;
    if(String(user.email||'').trim().toLowerCase()!==ADMIN_EMAIL){
      message.textContent='Geen toegang: dit account is geen beheerder.';
      return;
    }
    document.getElementById('adminEmail').textContent=user.email;
    document.getElementById('adminStatus').textContent='Admin toegang verleend ✓';
    message.hidden=true;
    protectedPanel.hidden=false;
    initAdmin();
  }catch(e){message.textContent='Geen toegang: beheerder kon niet worden geverifieerd. '+e.message;}
}
function initAdmin(){
  const pushStatus=document.getElementById('pushStatus');
  const swStatus=document.getElementById('swStatus');
  const result=document.getElementById('result');
  try{
    pushStatus.textContent='Permission: '+Notification.permission;
  }catch(e){pushStatus.textContent='Notification API niet beschikbaar';}
  if('serviceWorker' in navigator && navigator.serviceWorker.controller){
    swStatus.textContent='Service Worker actief ✓';
  }else{
    swStatus.textContent='Service Worker: controleren...';
    navigator.serviceWorker.ready.then(()=>{swStatus.textContent='Service Worker actief ✓';}).catch(()=>{swStatus.textContent='Service Worker niet actief';});
  }
  document.getElementById('btnLocal').onclick=async()=>{
    try{
      const reg=await navigator.serviceWorker.ready;
      await reg.showNotification('Nieuw(s)Ommen - Test',{body:'Lokale test melding werkt! ✓',icon:'./icons/icon-192x192.png',badge:'./icons/badge-lion-96x96.png'});
      result.textContent='Lokale notificatie verstuurd ✓\n(Als je niets ziet, check browser toestemming)';
    }catch(e){result.textContent='Fout lokale notificatie: '+e.message;}
  };
  document.getElementById('btnPush').onclick=async()=>{
    result.textContent='Echte push versturen via worker...';
    try{
      const token=localStorage.getItem('ommen_auth_token')||localStorage.getItem('auth_token')||localStorage.getItem('token')||'';
      if(!token){
        result.textContent='Geen ingelogde admin-sessie gevonden. Log eerst in.';
        return;
      }
      const r=await fetch('https://ommen-push-v2.leeuw008.workers.dev/api/admin/test-push',{
        method:'POST',
        headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},
        body:JSON.stringify({
          title:'Test Ommen '+(document.getElementById('pushTestSource')?.value||'Nieuwsbrief'),
          source:(document.getElementById('pushTestSource')?.value||'Nieuwsbrief'),
          link:'https://nieuwommen.leeuw008.nl/',
          body:'Dit is een echte push test via '+(document.getElementById('pushTestSource')?.value||'Nieuwsbrief'),
          filter:true,
          isReal:false
        })
      });
      const txt=await r.text();
      result.textContent='Response van /api/admin/test-push:\n'+txt;
    }catch(e){result.textContent='Fout bij echte push: '+e.message;}
  };
  document.getElementById('btnCheckDebug').onclick=async()=>{
    result.textContent='Debug ophalen...';
    try{
      const r=await fetch('https://ommen-push-v2.leeuw008.workers.dev/debug');
      const j=await r.json();
      result.textContent='Debug info:\n'+JSON.stringify(j,null,2);
    }catch(e){result.textContent='Fout debug: '+e.message;}
  };
}
document.addEventListener('DOMContentLoaded',()=>{
  checkAdmin();
});
</script>
</body>
</html>
