<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nieuw(s)Ommen</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css?v=299">
<link rel="icon" href="icons/icon-192x192.png" type="image/png">
<meta name="theme-color" content="#0b5bd3">
<style>.search-box{position:relative;width:100%;}.search-box #search-input{width:100%;box-sizing:border-box;padding-right:34px;}.search-clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:0;background:transparent;color:#64748b;font-size:22px;line-height:28px;padding:0;cursor:pointer;display:block}.search-clear:hover{color:#0b5bd3;}</style>
</head>
<body>
<header>
  <h1>
    <span class="title-left">📰 Nieuw(s)Ommen</span>
    <span class="header-icons">
      <a href="informatie.html" class="info-icon-btn" title="Info">i</a>
      <button id="user-icon-btn" class="user-icon-btn" title="Account" aria-label="Account">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="white" xmlns="http://www.w3.org/2000/svg"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
    </button>
    </span>
  </h1>
  <div class="filter-header" id="filter-header">
    <div class="filter-header-center"><div class="search-row"><div class="search-box"><input type="text" id="search-input" placeholder="Zoek in nieuws..." autocomplete="off"><button type="button" id="search-clear" class="search-clear" aria-label="Zoekveld leegmaken" title="Zoekveld leegmaken">×</button></div></div></div>
    <div class="filter-header-right">
      <div class="bell-slot" id="bell-slot"></div>
      <button class="btn-all-toets" id="btn-all">Alles aan</button>
      <span class="filter-header-arrow">▼</span>
    </div>
  </div>
  <div id="source-panel">
    <div class="panel-hint">
      <div><b>VANDAAG</b> <-> <b>MEER</b> = alleen vandaag of meerdere dagen</div>
      <div><b>GEMEENTE</b> <-> <b>REGIO</b> = alleen gemeente Ommen of ook regio</div>
      <div><b>AAN</b> <-> <b>UIT</b> = nieuwsbron wel of niet tonen in het overzicht</div>
    </div>
    <div class="source-list" id="source-list"></div>
    <div class="panel-footer">
      <button onclick="resetFilters()">Reset</button>
      <button class="primary" onclick="closePanel()">Sluiten ▲</button>
    </div>
  </div>
  <div id="news-container-anchor"></div>
  <div id="compat-hidden" style="display:none">
    <input type="checkbox" id="only-ommen" checked>
    <div id="compat-sources"></div>
  </div>
</header>
<main><div id="news-container">Bezig met laden...</div></main>
<footer><button onclick="refreshNews()">🔄 Vernieuwen</button></footer>

<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./service-worker.js?v=302', {scope: './'}).then(r=>{
    console.log('SW registered v297 rollback', r.scope);
  }).catch(e=>console.log('SW fail', e));
}
</script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const input=document.getElementById('search-input');
  const clear=document.getElementById('search-clear');
  if(!input||!clear)return;
  clear.addEventListener('click',e=>{
    e.preventDefault();
    e.stopPropagation();
    input.value='';
    input.focus();
    if(typeof filterNews==='function') filterNews();
  });
});
</script>
<script src="app.js?v=336"></script>
<script src="push.js?v=270-free-tier"></script>
<script src="article-focus.js?v=306"></script>
<script src="search-click-fix.js?v=1"></script>
</body>
</html>
